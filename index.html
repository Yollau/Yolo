<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat Lycée Jean Prouvé</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background-color: #1e1e2f; color: #fff; font-family: 'Segoe UI', sans-serif; }
  .container { max-width: 600px; }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 { font-size: 2rem; color: #5EBDBA; font-weight: bold; margin-bottom: 5px; }
  header h2 { font-size: 1rem; color: #a0a0ff; margin-top: 0; }

  .card { background-color: #2b2b3b; border: none; border-radius: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
  .card-title { color: #5EBDBA; }
  .form-control { background-color: #1e1e2f; border: 1px solid #444; color: #fff; }
  .form-control:focus { background-color: #1e1e2f; color: #fff; border-color: #5EBDBA; box-shadow: none; }

  .btn-primary { background-color: #5EBDBA; border: none; }
  .btn-primary:hover { background-color: #00a8cc; }
  .btn-success { background-color: #28a745; border: none; }
  .btn-success:hover { background-color: #1e7e34; }
  .btn-danger { background-color: #dc3545; border: none; }
  .btn-danger:hover { background-color: #b02a37; }

  #messages {
    height: 400px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 10px;
    background-color: #2b2b3b;
    border-radius: 10px;
    margin-bottom: 15px;
  }
  .message {
    padding: 10px 15px;
    border-radius: 12px;
    margin-bottom: 8px;
    max-width: 80%;
    word-wrap: break-word;
    transition: all 0.2s ease;
  }
  .message.other { background: #3a3a4f; color: #fff; align-self: flex-start; }
  .message.me { background: #5EBDBA; color: #1e1e2f; align-self: flex-end; }
  .message:hover { filter: brightness(1.1); }
  .message strong { color: inherit; }
</style>
</head>
<body>

<div class="container py-4">
  <header>
    <h1>Lycée Jean Prouvé</h1>
    <h2>Ville de Lomme – Chat étudiant</h2>
    <p id="userHeader">Bienvenue sur le chat !</p>
  </header>

  <div class="card mb-3" id="authCard">
    <div class="card-body">
      <h3 class="card-title mb-3">Connexion / Inscription</h3>
      <div class="mb-3">
        <input id="username" class="form-control" placeholder="Ton prénom ou pseudo">
      </div>
      <div class="mb-3">
        <input id="password" type="password" class="form-control" placeholder="Mot de passe">
      </div>
      <div class="d-grid gap-2">
        <button id="signupBtn" class="btn btn-success">Créer compte</button>
        <button id="loginBtn" class="btn btn-primary">Se connecter</button>
      </div>
      <div id="authStatus" class="mt-2 text-warning"></div>
    </div>
  </div>

  <div class="card" id="chatCard" style="display:none">
    <div class="card-body d-flex flex-column">
      <h3 class="card-title mb-3">Chat en direct</h3>
      <div id="messages" class="flex-grow-1 mb-3"></div>
      <div class="input-group mb-2">
        <input id="msgInput" type="text" class="form-control" placeholder="Ton message">
        <button id="sendBtn" class="btn btn-primary">Envoyer</button>
      </div>
      <button id="logoutBtn" class="btn btn-danger">Se déconnecter</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js';
import { getDatabase, ref, push, onValue, set, get, update } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyAdTo4vN75rTcMqiVmRuGla22vfFUe3dlk",
  authDomain: "platformergamedbleaderboard.firebaseapp.com",
  databaseURL: "https://platformergamedbleaderboard-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "platformergamedbleaderboard",
  storageBucket: "platformergamedbleaderboard.firebasestorage.app",
  messagingSenderId: "757117927148",
  appId: "1:757117927148:web:8ee536968fb43cef9d6fc9",
  measurementId: "G-838M0K757E"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentUser = null;

const authCard = document.getElementById('authCard');
const chatCard = document.getElementById('chatCard');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const authStatus = document.getElementById('authStatus');
const signupBtn = document.getElementById('signupBtn');
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const messagesDiv = document.getElementById('messages');
const userHeader = document.getElementById('userHeader');

function generateToken(length = 5) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let token = '';
  for(let i=0;i<length;i++){
    token += chars.charAt(Math.floor(Math.random()*chars.length));
  }
  return token;
}

// Vérification token au chargement
window.addEventListener('DOMContentLoaded', async () => {
  const savedUser = localStorage.getItem('currentUser');
  const savedToken = localStorage.getItem('token');
  if(savedUser && savedToken){
    const snapshot = await get(ref(db, 'users/' + savedUser));
    if(snapshot.exists() && snapshot.val().token === savedToken){
      currentUser = savedUser;
      authCard.style.display = 'none';
      chatCard.style.display = 'block';
      userHeader.textContent = `Connecté en tant que ${currentUser}`;
      loadMessages();
    } else {
      localStorage.removeItem('currentUser');
      localStorage.removeItem('token');
    }
  }
});

// Création de compte
signupBtn.onclick = async () => {
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();
  if(!username || !password){ authStatus.textContent = 'Tous les champs sont requis'; return; }

  const userRef = ref(db, 'users/' + username);
  const snapshot = await get(userRef);
  if(snapshot.exists()){ authStatus.textContent = 'Nom déjà utilisé'; return; }

  const token = generateToken();
  await set(userRef, { password, token });
  localStorage.setItem('token', token);
  localStorage.setItem('currentUser', username);

  currentUser = username;
  authCard.style.display = 'none';
  chatCard.style.display = 'block';
  userHeader.textContent = `Connecté en tant que ${currentUser}`;
  loadMessages();
};

// Connexion
loginBtn.onclick = async () => {
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();
  if(!username || !password){ authStatus.textContent = 'Tous les champs sont requis'; return; }

  const snapshot = await get(ref(db, 'users/' + username));
  if(!snapshot.exists()){ authStatus.textContent = 'Utilisateur non trouvé'; return; }
  if(snapshot.val().password !== password){ authStatus.textContent = 'Mot de passe incorrect'; return; }

  // Connexion OK, on met à jour le token
  const token = snapshot.val().token || generateToken();
  await update(ref(db, 'users/' + username), { token });
  localStorage.setItem('token', token);
  localStorage.setItem('currentUser', username);

  currentUser = username;
  authCard.style.display = 'none';
  chatCard.style.display = 'block';
  userHeader.textContent = `Connecté en tant que ${currentUser}`;
  loadMessages();
};

// Déconnexion
logoutBtn.onclick = () => {
  currentUser = null;
  localStorage.removeItem('currentUser');
  localStorage.removeItem('token');
  authCard.style.display = 'block';
  chatCard.style.display = 'none';
  messagesDiv.innerHTML = '';
  usernameInput.value = '';
  passwordInput.value = '';
  userHeader.textContent = "Bienvenue sur le chat !";
};

// Chat
const chatRef = ref(db, 'chat');
sendBtn.onclick = async () => {
  const msg = msgInput.value.trim();
  if(!msg || !currentUser) return;
  await push(chatRef, { user: currentUser, text: msg, createdAt: Date.now() });
  msgInput.value = '';
};

function loadMessages(){
  onValue(chatRef, snapshot => {
    const data = snapshot.val() || {};
    messagesDiv.innerHTML = '';
    Object.keys(data).sort((a,b)=>data[a].createdAt - data[b].createdAt).forEach(key => {
      const m = data[key];
      const div = document.createElement('div');
      div.className = 'message ' + (m.user === currentUser ? 'me' : 'other');
      div.innerHTML = `<strong>${escapeHtml(m.user)}</strong>: ${escapeHtml(m.text)}`;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
  });
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
